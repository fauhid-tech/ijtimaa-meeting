<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meeting</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel-2:#1c232e; --line:#2a323d;
    --text:#e6e9ee; --dim:#8b95a1; --accent:#3d8bfd; --accent-2:#2563eb; --danger:#e5484d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  .screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;}
  .card h1{font-size:19px;margin:0 0 4px;font-weight:600;}
  .card p.sub{color:var(--dim);font-size:13px;margin:0 0 22px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;}
  .btn{width:100%;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;background:var(--accent-2);color:#fff;}
  .btn:hover{background:var(--accent);}
  .btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
  .status{font-size:12px;color:var(--dim);margin-top:14px;min-height:16px;text-align:center;}
  .divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:18px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .link-box{display:flex;gap:8px;margin-top:6px;}
  .link-box input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font-size:13px;}
  .link-box button{border:none;border-radius:8px;padding:0 16px;background:var(--accent-2);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}

  #room{display:none;flex:1;flex-direction:column;min-height:0;position:relative;}

  #stageArea{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

  #mainStage{display:none;flex:0 1 auto;min-height:0;position:relative;background:#000;margin:6px 6px 0;border-radius:8px;overflow:hidden;flex-grow:1;}
  #mainStage video{width:100%;height:100%;object-fit:contain;background:#000;display:block;}
  #mainStage .name{position:absolute;left:10px;bottom:10px;font-size:12px;background:rgba(0,0,0,.6);padding:3px 10px;border-radius:6px;}
  #unpinBtn{position:absolute;top:10px;right:10px;background:rgba(20,25,32,.85);border:1px solid var(--line);color:var(--text);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;}

  #grid{flex:1;min-height:0;display:grid;gap:6px;padding:6px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));grid-auto-rows:minmax(0,1fr);align-content:stretch;overflow-y:auto;transition:flex .15s;}
  #grid.filmstrip{flex:0 0 92px;grid-auto-flow:column;grid-auto-columns:130px;grid-template-columns:none;grid-template-rows:1fr;overflow-x:auto;overflow-y:hidden;}

  .tile{position:relative;background:#000;border-radius:8px;overflow:hidden;min-height:80px;cursor:pointer;border:2px solid transparent;}
  .tile.pinned{border-color:var(--accent);}
  .tile video{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .name{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:6px;white-space:nowrap;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;}
  .tile .micoff{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.6);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;}

  #controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);flex:0 0 auto;position:relative;z-index:5;}
  .ctrl-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;position:relative;}
  .ctrl-btn.active{background:var(--accent-2);border-color:var(--accent-2);}
  .ctrl-btn.off{background:var(--danger);border-color:var(--danger);}
  .ctrl-btn.end{background:var(--danger);border-color:var(--danger);}
  .badge-count{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

  #roomLabel{position:absolute;top:10px;left:10px;background:rgba(20,25,32,.85);border:1px solid var(--line);padding:5px 10px;border-radius:16px;font-size:11px;color:var(--dim);z-index:6;}
  #roomLabel span{color:var(--text);font-weight:600;}

  #participantsPanel{display:none;position:absolute;right:0;top:0;bottom:0;width:280px;max-width:80vw;background:var(--panel);border-left:1px solid var(--line);z-index:10;flex-direction:column;}
  #participantsPanel .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  #participantsPanel .ph h3{margin:0;font-size:14px;font-weight:600;}
  #participantsPanel .closeP{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;}
  #participantsList{flex:1;overflow-y:auto;padding:8px;}
  .prow{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;}
  .prow:hover{background:var(--panel-2);}
  .prow .pname{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prow .ptag{font-size:10px;color:var(--dim);}
  .prow .pmic{font-size:13px;color:var(--dim);width:18px;text-align:center;}
  .prow button.cohost-btn{font-size:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 8px;cursor:pointer;white-space:nowrap;}
  .prow button.cohost-btn.active{background:var(--accent-2);border-color:var(--accent-2);}
</style>
</head>
<body>

<!-- EDIT DUA BARIS INI SEBELUM DI-DEPLOY -->
<script>
  const TOKEN_SERVER_URL = "/.netlify/functions/token";
  const LIVEKIT_WS_URL   = "wss://meeting-ut7whogq.livekit.cloud";
</script>

<div class="screen" id="home">
  <div class="card">
    <h1>Meeting</h1>
    <p class="sub">Buat ruang baru lalu bagikan linknya, atau masuk pakai kode dari teman.</p>
    <button class="btn" id="createBtn">Buat meeting baru</button>
    <div class="divider">atau</div>
    <div class="field">
      <label for="joinCodeInput">Kode meeting</label>
      <input id="joinCodeInput" type="text" placeholder="Contoh: rapat-pagi-482">
    </div>
    <button class="btn btn-secondary" id="joinByCodeBtn">Gabung</button>
  </div>
</div>

<div class="screen" id="linkReady" style="display:none;">
  <div class="card">
    <h1>Meeting sudah siap</h1>
    <p class="sub">Bagikan link ini ke peserta lain. Kamu jadi host meeting ini.</p>
    <div class="link-box">
      <input id="shareLink" type="text" readonly>
      <button id="copyLinkBtn">Salin</button>
    </div>
    <button class="btn" id="startNowBtn" style="margin-top:22px;">Masuk sekarang</button>
  </div>
</div>

<div class="screen" id="namePrompt" style="display:none;">
  <div class="card">
    <h1>Masuk meeting</h1>
    <p class="sub" id="roomPreviewText"></p>
    <div class="field">
      <label for="identityInput">Nama kamu</label>
      <input id="identityInput" type="text" placeholder="Nama">
    </div>
    <button class="btn" id="enterBtn">Masuk</button>
    <div class="status" id="joinStatus"></div>
  </div>
</div>

<div id="room">
  <div id="roomLabel">Ruang: <span id="roomLabelText"></span></div>

  <div id="stageArea">
    <div id="mainStage">
      <video id="spotlightVideo" autoplay playsinline></video>
      <div class="name" id="spotlightName"></div>
      <button id="unpinBtn">Kembali ke grid</button>
    </div>
    <div id="grid"></div>
  </div>

  <div id="participantsPanel">
    <div class="ph"><h3 id="participantsTitle">Peserta</h3><button class="closeP" id="closePanelBtn">&times;</button></div>
    <div id="participantsList"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn active" id="micBtn" title="Mikrofon">🎤</button>
    <button class="ctrl-btn active" id="camBtn" title="Kamera">📷</button>
    <button class="ctrl-btn" id="shareBtn" title="Share layar">🖥️</button>
    <button class="ctrl-btn" id="participantsBtn" title="Peserta">👥<span class="badge-count" id="participantsCount">1</span></button>
    <button class="ctrl-btn end" id="endBtn" title="Akhiri panggilan">✕</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let room, micOn = true, camOn = true, sharing = false;
let currentRoomCode = null;
let myIdentity = null;
let isHost = false;
let hostIdentity = null;
const coHosts = new Set();
const participantMeta = new Map(); // identity -> {name, micOn, camOn, tiles:{camera:el, screen:el}}
let spotlightKey = null;   // "identity::kind"
let autoSpotlightFromScreen = null;

function showScreen(id){
  ["home","linkReady","namePrompt"].forEach(s => $(s).style.display = (s===id) ? "flex" : "none");
  $("room").style.display = "none";
}

function generateRoomCode(){
  const words = ["meja","langit","pagi","kopi","elang","sungai","batu","angin"];
  const w = words[Math.floor(Math.random()*words.length)];
  const n = Math.floor(100 + Math.random()*900);
  return `${w}-${n}`;
}

function buildShareUrl(roomCode){
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("room", roomCode);
  return url.toString();
}

// ---------- Home actions ----------
$("createBtn").addEventListener("click", ()=>{
  currentRoomCode = generateRoomCode();
  isHost = true;
  const link = buildShareUrl(currentRoomCode);
  $("shareLink").value = link;
  showScreen("linkReady");
});

$("copyLinkBtn").addEventListener("click", async ()=>{
  try{
    await navigator.clipboard.writeText($("shareLink").value);
    $("copyLinkBtn").textContent = "Tersalin";
    setTimeout(()=> $("copyLinkBtn").textContent = "Salin", 1500);
  }catch(e){
    $("shareLink").select();
  }
});

$("startNowBtn").addEventListener("click", ()=> goToNamePrompt(currentRoomCode));
$("joinByCodeBtn").addEventListener("click", ()=>{
  const code = $("joinCodeInput").value.trim();
  if(!code) return;
  isHost = false;
  goToNamePrompt(code);
});

function goToNamePrompt(roomCode){
  currentRoomCode = roomCode;
  $("roomPreviewText").textContent = `Kamu akan masuk ke ruang "${roomCode}"${isHost ? " sebagai host" : ""}`;
  showScreen("namePrompt");
}

window.addEventListener("DOMContentLoaded", ()=>{
  const params = new URLSearchParams(window.location.search);
  const roomFromUrl = params.get("room");
  if(roomFromUrl){
    isHost = false;
    goToNamePrompt(roomFromUrl);
  } else {
    showScreen("home");
  }
});

// ---------- Audio: remote track playback + join/leave tone ----------
const audioEls = new Map(); // key -> <audio> element

function attachAudio(identity, kind, track){
  const key = tileKey(identity, kind) + "::audio";
  detachAudio(identity, kind);
  const audioEl = document.createElement("audio");
  audioEl.autoplay = true;
  audioEl.style.display = "none";
  track.attach(audioEl);
  document.body.appendChild(audioEl);
  audioEls.set(key, audioEl);
}
function detachAudio(identity, kind){
  const key = tileKey(identity, kind) + "::audio";
  const el = audioEls.get(key);
  if(el){ el.remove(); audioEls.delete(key); }
}

let audioCtx = null;
function playTone(kind){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    const now = ctx.currentTime;
    if(kind === "join"){
      o.frequency.setValueAtTime(660, now);
      o.frequency.setValueAtTime(880, now + 0.12);
    } else {
      o.frequency.setValueAtTime(660, now);
      o.frequency.setValueAtTime(440, now + 0.12);
    }
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
    o.start(now);
    o.stop(now + 0.3);
  }catch(e){ /* ignore */ }
}

// ---------- Tile helpers ----------
function tileKey(identity, kind){ return identity + "::" + kind; }

function ensureParticipant(identity, name){
  if(!participantMeta.has(identity)){
    participantMeta.set(identity, { name: name || identity, micOn:true, camOn:true, tiles:{} });
  }
  return participantMeta.get(identity);
}

function makeTile(identity, kind, track, displayName, isLocal){
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.dataset.key = tileKey(identity, kind);
  const video = document.createElement("video");
  video.autoplay = true; video.playsInline = true;
  if(isLocal && kind === "camera") video.muted = true;
  track.attach(video);
  const label = document.createElement("div");
  label.className = "name";
  label.textContent = displayName;
  tile.appendChild(video);
  tile.appendChild(label);
  tile.addEventListener("click", ()=> toggleSpotlight(identity, kind));
  return tile;
}

function labelFor(identity){
  const meta = participantMeta.get(identity);
  let n = meta ? meta.name : identity;
  if(identity === hostIdentity) n += " • Host";
  else if(coHosts.has(identity)) n += " • Co-host";
  if(identity === myIdentity) n += " (kamu)";
  return n;
}

function refreshAllLabels(){
  document.querySelectorAll(".tile .name").forEach(el=>{
    const tile = el.closest(".tile");
    const key = tile.dataset.key;
    const identity = key.split("::")[0];
    el.textContent = labelFor(identity) + (key.endsWith("::screen") ? " (share layar)" : "");
  });
  if(spotlightKey){
    const identity = spotlightKey.split("::")[0];
    $("spotlightName").textContent = labelFor(identity) + (spotlightKey.endsWith("::screen") ? " (share layar)" : "");
  }
  renderParticipantsPanel();
}

function addTrackTile(identity, kind, track, displayName, isLocal){
  const meta = ensureParticipant(identity, displayName);
  const key = tileKey(identity, kind);
  removeTrackTile(identity, kind);
  const tile = makeTile(identity, kind, track, labelFor(identity) + (kind==="screen" ? " (share layar)" : ""), isLocal);
  meta.tiles[kind] = tile;
  $("grid").appendChild(tile);

  if(kind === "screen"){
    autoSpotlightFromScreen = key;
    spotlightKey = key;
  }
  layout();
  renderParticipantsPanel();
}

function removeTrackTile(identity, kind){
  const meta = participantMeta.get(identity);
  if(meta && meta.tiles[kind]){
    meta.tiles[kind].remove();
    delete meta.tiles[kind];
  }
  const key = tileKey(identity, kind);
  if(spotlightKey === key){
    spotlightKey = null;
    if(autoSpotlightFromScreen === key) autoSpotlightFromScreen = null;
  }
  layout();
}

function toggleSpotlight(identity, kind){
  const key = tileKey(identity, kind);
  if(spotlightKey === key){
    spotlightKey = null;
  } else {
    spotlightKey = key;
  }
  layout();
}

$("unpinBtn").addEventListener("click", ()=>{ spotlightKey = null; layout(); });

function layout(){
  document.querySelectorAll(".tile").forEach(t => t.classList.toggle("pinned", t.dataset.key === spotlightKey));

  if(spotlightKey){
    const identity = spotlightKey.split("::")[0];
    const kind = spotlightKey.split("::")[1];
    const meta = participantMeta.get(identity);
    const sourceTile = meta && meta.tiles[kind];
    if(sourceTile){
      const sourceVideo = sourceTile.querySelector("video");
      const spotVideo = $("spotlightVideo");
      if(sourceVideo && sourceVideo.srcObject !== spotVideo.srcObject){
        spotVideo.srcObject = sourceVideo.srcObject;
      }
      $("spotlightName").textContent = labelFor(identity) + (kind==="screen" ? " (share layar)" : "");
      $("mainStage").style.display = "block";
      $("grid").classList.add("filmstrip");
    } else {
      spotlightKey = null;
      $("mainStage").style.display = "none";
      $("grid").classList.remove("filmstrip");
    }
  } else {
    $("mainStage").style.display = "none";
    $("grid").classList.remove("filmstrip");
    $("spotlightVideo").srcObject = null;
  }
}

// ---------- Participants panel ----------
function renderParticipantsPanel(){
  const list = $("participantsList");
  list.innerHTML = "";
  $("participantsTitle").textContent = `Peserta (${participantMeta.size})`;
  $("participantsCount").textContent = participantMeta.size;
  participantMeta.forEach((meta, identity)=>{
    const row = document.createElement("div");
    row.className = "prow";
    const nameEl = document.createElement("div");
    nameEl.className = "pname";
    nameEl.textContent = labelFor(identity);
    const micEl = document.createElement("div");
    micEl.className = "pmic";
    micEl.textContent = meta.micOn ? "🎤" : "🔇";
    row.appendChild(nameEl);
    row.appendChild(micEl);
    if(isHost && identity !== myIdentity && identity !== hostIdentity){
      const btn = document.createElement("button");
      btn.className = "cohost-btn" + (coHosts.has(identity) ? " active" : "");
      btn.textContent = coHosts.has(identity) ? "Co-host ✓" : "Jadikan Co-host";
      btn.addEventListener("click", ()=> toggleCoHost(identity));
      row.appendChild(btn);
    }
    list.appendChild(row);
  });
}

function toggleCoHost(identity){
  const value = !coHosts.has(identity);
  if(value) coHosts.add(identity); else coHosts.delete(identity);
  broadcast({ type:"cohost", identity, value });
  refreshAllLabels();
}

$("participantsBtn").addEventListener("click", ()=>{
  const panel = $("participantsPanel");
  panel.style.display = panel.style.display === "flex" ? "none" : "flex";
});
$("closePanelBtn").addEventListener("click", ()=> $("participantsPanel").style.display = "none");

// ---------- Data messages (host / co-host sync) ----------
function broadcast(obj){
  if(!room) return;
  const data = new TextEncoder().encode(JSON.stringify(obj));
  room.localParticipant.publishData(data, { reliable: true });
}

function handleData(payload){
  let msg;
  try{ msg = JSON.parse(new TextDecoder().decode(payload)); }catch(e){ return; }
  if(msg.type === "host"){
    hostIdentity = msg.identity;
    refreshAllLabels();
  } else if(msg.type === "cohost"){
    if(msg.value) coHosts.add(msg.identity); else coHosts.delete(msg.identity);
    refreshAllLabels();
  } else if(msg.type === "request-host" && isHost){
    broadcast({ type:"host", identity: myIdentity });
    coHosts.forEach(id => broadcast({ type:"cohost", identity:id, value:true }));
  }
}

// ---------- Join room (LiveKit) ----------
$("enterBtn").addEventListener("click", async ()=>{
  const identity = $("identityInput").value.trim();
  if(!identity){
    $("joinStatus").textContent = "Isi nama dulu.";
    return;
  }
  await joinRoom(currentRoomCode, identity);
});

async function joinRoom(roomName, identity){
  try{
    $("joinStatus").textContent = "Menghubungkan...";
    const res = await fetch(`${TOKEN_SERVER_URL}?room=${encodeURIComponent(roomName)}&identity=${encodeURIComponent(identity)}`);
    if(!res.ok) throw new Error("Token server menolak permintaan.");
    const { token } = await res.json();

    myIdentity = identity;
    if(isHost) hostIdentity = identity;
    ensureParticipant(identity, identity);

    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      ensureParticipant(participant.identity, participant.identity);
      if(track.kind === "video"){
        const kind = track.source === LivekitClient.Track.Source.ScreenShare ? "screen" : "camera";
        addTrackTile(participant.identity, kind, track, participant.identity, false);
      } else if(track.kind === "audio"){
        attachAudio(participant.identity, "mic", track);
      }
    });
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
      if(track.kind === "video"){
        const kind = track.source === LivekitClient.Track.Source.ScreenShare ? "screen" : "camera";
        removeTrackTile(participant.identity, kind);
      } else if(track.kind === "audio"){
        detachAudio(participant.identity, "mic");
      }
    });
    room.on(LivekitClient.RoomEvent.TrackMuted, (pub, participant) => {
      const meta = ensureParticipant(participant.identity, participant.identity);
      if(pub.kind === "audio") meta.micOn = false;
      renderParticipantsPanel();
    });
    room.on(LivekitClient.RoomEvent.TrackUnmuted, (pub, participant) => {
      const meta = ensureParticipant(participant.identity, participant.identity);
      if(pub.kind === "audio") meta.micOn = true;
      renderParticipantsPanel();
    });
    room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
      ensureParticipant(participant.identity, participant.identity);
      renderParticipantsPanel();
      playTone("join");
      if(isHost){
        broadcast({ type:"host", identity: myIdentity });
        coHosts.forEach(id => broadcast({ type:"cohost", identity:id, value:true }));
      }
    });
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
      removeTrackTile(participant.identity, "camera");
      removeTrackTile(participant.identity, "screen");
      detachAudio(participant.identity, "mic");
      participantMeta.delete(participant.identity);
      renderParticipantsPanel();
      playTone("leave");
    });
    room.on(LivekitClient.RoomEvent.DataReceived, (payload) => handleData(payload));
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      showScreen("home");
    });

    await room.connect(LIVEKIT_WS_URL, token);
    await room.localParticipant.enableCameraAndMicrophone();

    const camPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
    if(camPub && camPub.track){
      addTrackTile(identity, "camera", camPub.track, identity, true);
    }

    if(isHost){
      broadcast({ type:"host", identity: myIdentity });
    } else {
      broadcast({ type:"request-host" });
    }

    const newUrl = buildShareUrl(roomName);
    window.history.replaceState({}, "", newUrl);

    $("roomLabelText").textContent = roomName;
    ["home","linkReady","namePrompt"].forEach(s => $(s).style.display = "none");
    $("room").style.display = "flex";
    renderParticipantsPanel();
  }catch(e){
    console.error(e);
    $("joinStatus").textContent = "Gagal join: " + e.message;
  }
}

// ---------- Controls ----------
$("micBtn").addEventListener("click", async ()=>{
  if(!room) return;
  micOn = !micOn;
  await room.localParticipant.setMicrophoneEnabled(micOn);
  const meta = ensureParticipant(myIdentity, myIdentity);
  meta.micOn = micOn;
  $("micBtn").classList.toggle("active", micOn);
  $("micBtn").classList.toggle("off", !micOn);
  $("micBtn").textContent = micOn ? "🎤" : "🔇";
  renderParticipantsPanel();
});

$("camBtn").addEventListener("click", async ()=>{
  if(!room) return;
  camOn = !camOn;
  await room.localParticipant.setCameraEnabled(camOn);
  $("camBtn").classList.toggle("active", camOn);
  $("camBtn").classList.toggle("off", !camOn);
  $("camBtn").textContent = camOn ? "📷" : "🚫";
});

$("shareBtn").addEventListener("click", async ()=>{
  if(!room) return;
  sharing = !sharing;
  await room.localParticipant.setScreenShareEnabled(sharing);
  $("shareBtn").classList.toggle("active", sharing);
  if(sharing){
    const pub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.ScreenShare);
    if(pub && pub.track) addTrackTile(myIdentity, "screen", pub.track, myIdentity, true);
  } else {
    removeTrackTile(myIdentity, "screen");
  }
});

$("endBtn").addEventListener("click", async ()=>{
  if(room) await room.disconnect();
  window.location.href = window.location.pathname;
});
</script>
</body>
</html>
